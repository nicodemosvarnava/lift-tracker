<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<title>Lift Tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="./icons/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- WORKOUT SHELL (header + day-tabs + progress + dropdown + exercise + done) -->
<div id="workout-shell">
  <div class="header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-tile"><svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true">
          <defs><linearGradient id="brandLime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4ff6b"/><stop offset="1" stop-color="#a6d61c"/></linearGradient></defs>
          <g fill="url(#brandLime)" transform="translate(0 24)">
            <path d="M176 368 L256 288 L336 368" fill="none" stroke="#c8f135" stroke-opacity="0.35" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M176 342 L256 262 L336 342" fill="none" stroke="url(#brandLime)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="52" y="160" width="408" height="22" rx="11"/>
            <rect x="116" y="76" width="40" height="190" rx="12"/><rect x="356" y="76" width="40" height="190" rx="12"/>
            <rect x="80" y="106" width="28" height="130" rx="10"/><rect x="404" y="106" width="28" height="130" rx="10"/>
            <rect x="160" y="150" width="12" height="42" rx="4"/><rect x="340" y="150" width="12" height="42" rx="4"/>
          </g>
        </svg></span>
        <span class="app-title">LIFT</span>
      </div>
      <div class="header-right">
        <span class="sync-dot off" id="sync-dot" title="Sync not configured"></span>
        <div class="date-badge" id="date-badge">—</div>
      </div>
    </div>
    <div class="day-tabs">
      <button class="day-tab active" data-day="A">DAY A · FULL BODY</button>
      <button class="day-tab" data-day="B">DAY B · FULL BODY</button>
    </div>
  </div>

  <div class="progress-bar-wrap" id="progress-wrap">
    <div class="progress-label">
      <span id="progress-label-text">Exercise 1 of 8</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div class="ex-dropdown-wrap" id="dropdown-wrap">
    <select class="ex-dropdown" id="ex-dropdown"></select>
  </div>

  <div id="workout-view">
    <div class="exercise-view" id="exercise-view"></div>
  </div>

  <div class="done-screen" id="done-screen">
    <div class="done-icon"><img src="./icons/logo.svg" alt=""></div>
    <div class="done-title">SESSION DONE</div>
    <div class="done-sub" id="done-duration">—</div>
    <div class="session-summary" id="session-summary"></div>
    <button class="save-btn" id="btn-save">SAVE SESSION</button>
    <button class="reset-btn" id="btn-reset">Start New Session</button>
  </div>
</div>

<!-- HISTORY VIEW -->
<div class="history-view" id="history-view">
  <div id="history-content"></div>
</div>

<!-- PROGRESS VIEW -->
<div class="progress-view" id="progress-view">
  <div id="progress-content"></div>
</div>

<!-- SETTINGS VIEW -->
<div class="settings-view" id="settings-view">
  <div id="settings-content"></div>
</div>

<div class="toast" id="toast">Saved!</div>

<div class="bottom-nav">
  <button class="bottom-nav-btn active" data-view="workout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 4v16M18 4v16M6 12h12M3 8h3M18 8h3M3 16h3M18 16h3"/></svg>
    Workout
  </button>
  <button class="bottom-nav-btn" data-view="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    History
  </button>
  <button class="bottom-nav-btn" data-view="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17l6-6 4 4 8-8M21 7v6h-6"/></svg>
    Progress
  </button>
  <button class="bottom-nav-btn" data-view="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h.01a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h.01a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.01a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Settings
  </button>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
